<div class="p-5 divider-b-1 border-color-1">
    <h2 class="font-medium">Change Password</h2>
</div>
<section class="change-password">
    <form>
        <div>
            <label for="current-password">Current Password</label>
            <input type="text" name="current-password" id="current-password" placeholder="Current Password">
        </div>
        <div>
            <label for="new-password">New Password</label>
            <input type="text" name="new-password" id="new-password" placeholder="New Password">
        </div>
        <div>
            <label for="confirm-password">First Name</label>
            <input type="text" name="confirm-password" id="confirm-password" placeholder="Confirm New Password">
        </div>
        <button type="button" id="change-password">Change Password</button>
    </form>
</section>
