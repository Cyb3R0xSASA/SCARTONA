<form>
    <div class="name">
        <div>
            <label for="fname">First Name</label>
            <input type="text" name="fname" id="fname" placeholder="First Name">
        </div>
        <div>
            <label for="lname">Last Name</label>
            <input type="text" name="lname" id="lname" placeholder="Last name">
        </div>
    </div>
    <div>
        <div>
            <label for="country">Country/Region</label>
            <select name="country">
                <option value="eg">Egypt</option>
                <option value="eg">Suadia Arabia</option>
                <option value="eg">Kwait</option>
            </select>
        </div>
        <div>
            <label for="zip-code">ZIP Code</label>
            <input type="text" name="zip-code" id="zip-code" placeholder="Input ZIP Code">
        </div>
    </div>
    <div class="credit-card-details">
        <div>
            <label for="card-number">Card Number</label>
            <input type="text" name="card-number" id="card-number" placeholder="xxxx-xxxx-xxxx-xxxx">
        </div>
        <div>
            <label for="expires">Expires</label>
            <input type="text" name="expires" id="expires" placeholder="mm/yy">
        </div>
        <div>
            <label for="cvv">CVV</label>
            <input type="text" name="cvv" id="cvv" placeholder="xxx">
        </div>
    </div>
    <button type="button" id="credit-card-method">Proceed Payment</button>
</form>
