<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="../sign.css">
    <link rel="stylesheet" href="/css/all.min.css">
    <link rel="stylesheet" href="/css/boxicons.min.css">
    <title>Sign UP</title>
</head>
<body>
    <div id="header"></div>
    <div id="breadcrumb"></div>
    <section class="sign-box flex">
        <h2>Sign Up</h2>
        <form autocomplete="off" method="post">
            <div class="name flex">
                <input type="text" name="fname" placeholder="First Name">
                <input type="text" name="lname" placeholder="Last Name">
            </div>
            <input type="text" placeholder="Email" name="email">
            <div class="password">
                <input type="password" name="password1" placeholder="Password">
                <button type="button" id="showBtn1"><i class='bx bxs-lock-alt' ></i></button>
            </div>
            <p id="password1Error" class="error"></p>
            <div class="password">
                <input type="password" name="password2" placeholder="Confirm Password">
                <button type="button" id="showBtn2"><i class='bx bxs-lock-alt'></i></button>
            </div>
            <p id="password2Error" class="error"></p>
            <div class="check-password flex">
                <div class="check flex">
                    <input type="checkbox" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
            </div>
            <button type="submit" class="sing-btn">
                Sign Up
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </form>
        <p>Have account? <a href="../signin/signin.html">Sign in</a></p>
    </section>
    <div id="footer"></div>
    <script src="/js/components.js"></script>
    <script src="./signup.js"></script>
</body>
</html>
