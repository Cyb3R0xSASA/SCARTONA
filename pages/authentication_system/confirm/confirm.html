<h2 class="text-3xl font-semibold text-primary">New Password</h2>
<form class="w-full" autocomplete="off" method="post">
    <div class="password">
        <input class="w-full mb-5 bg-secondary outline-none border-none text-base font-normal text-secondary-active" type="password" name="password1" placeholder="New Password">
        <button type="button" id="showBtn1"><i class='bx bxs-lock-alt' ></i></button>
    </div>
    <p id="password1Error" class="error text-red font-semibold text-base"></p>
    <div class="password">
        <input class="w-full mb-5 bg-secondary outline-none border-none text-base font-normal text-secondary-active " type="password" name="password2" placeholder="Confirm New Password">
        <button type="button" id="showBtn2"><i class='bx bxs-lock-alt'></i></button>
    </div>
    <p id="password2Error" class="error text-red font-semibold text-base"></p>
    <div class="check-password flex">
        <div class="check flex">
            <input class="w-full mb-5 bg-secondary outline-none border-none text-base font-normal text-secondary-active" type="checkbox" name="remember">
            <label for="remember">Remember Me</label>
        </div>
    </div>
    <button type="submit" class="sing-btn">
        Update Password
        <i class="fa-solid fa-arrow-right-long"></i>
    </button>
</form>
